[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-ast-pruner"
version = "0.1.0"
description = "Syntax-aware AST prompt minifier stripping redundant comments, docstrings, and whitespace"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
prompt-ast-pruner = "prompt_ast_pruner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prompt_ast_pruner*"]
